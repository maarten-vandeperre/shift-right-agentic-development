apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-init
  namespace: agentic
  labels:
    app: postgresql
data:
  init.sh: |
    #!/bin/bash
    psql -d "${POSTGRESQL_DATABASE}" <<'EOSQL'

    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

    CREATE TABLE IF NOT EXISTS address (
        ref UUID PRIMARY KEY,
        line_1 VARCHAR(255) NOT NULL,
        line_2 VARCHAR(255),
        country VARCHAR(100) NOT NULL
    );

    CREATE TABLE IF NOT EXISTS person (
        ref UUID PRIMARY KEY,
        first_name VARCHAR(100) NOT NULL,
        last_name VARCHAR(100) NOT NULL,
        email VARCHAR(255) NOT NULL UNIQUE,
        address_ref UUID REFERENCES address(ref)
    );

    INSERT INTO address (ref, line_1, line_2, country) VALUES
        ('d4e5f6a7-b8c9-0123-defa-234567890123', '123 Main Street', 'Apt 4B', 'Belgium'),
        ('e5f6a7b8-c9d0-1234-efab-345678901234', '456 Oak Avenue', 'Suite 100', 'Netherlands'),
        ('f6a7b8c9-d0e1-2345-fabc-456789012345', '78 King Boulevard', NULL, 'Germany')
    ON CONFLICT (ref) DO NOTHING;

    INSERT INTO person (ref, first_name, last_name, email, address_ref) VALUES
        ('a1b2c3d4-e5f6-7890-abcd-ef1234567890', 'John', 'Doe', 'john.doe@example.com', 'd4e5f6a7-b8c9-0123-defa-234567890123'),
        ('b2c3d4e5-f6a7-8901-bcde-f12345678901', 'Jane', 'Smith', 'jane.smith@example.com', 'e5f6a7b8-c9d0-1234-efab-345678901234'),
        ('c3d4e5f6-a7b8-9012-cdef-123456789012', 'Bob', 'Johnson', 'bob.johnson@example.com', 'd4e5f6a7-b8c9-0123-defa-234567890123'),
        ('01234567-89ab-cdef-0123-456789abcdef', 'Alice', 'Williams', 'alice.williams@example.com', 'f6a7b8c9-d0e1-2345-fabc-456789012345')
    ON CONFLICT (ref) DO NOTHING;

    EOSQL
