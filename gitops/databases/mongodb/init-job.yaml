apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-init
  namespace: agentic
  labels:
    app: mongodb
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: mongodb-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: docker.io/mongo:4.4
          envFrom:
            - secretRef:
                name: mongodb-credentials
          command:
            - /bin/bash
            - -c
            - |
              echo "Waiting for MongoDB to be ready..."
              for i in $(seq 1 30); do
                if mongo mongodb:27017/admin -u admin -p "${MONGODB_ADMIN_PASSWORD}" --eval "quit()" 2>/dev/null; then
                  echo "MongoDB is ready."
                  break
                fi
                echo "Attempt $i/30 - MongoDB not ready, waiting..."
                sleep 5
              done

              echo "Creating application user and seeding data..."
              mongo mongodb:27017/admin -u admin -p "${MONGODB_ADMIN_PASSWORD}" <<EOJS
              use ${MONGODB_DATABASE};

              db.createUser({
                user: "${MONGODB_USER}",
                pwd: "${MONGODB_PASSWORD}",
                roles: [{ role: "readWrite", db: "${MONGODB_DATABASE}" }]
              });

              var existing = db.people.count();
              if (existing > 0) {
                print("Collection already has " + existing + " documents, skipping seed.");
                quit(0);
              }

              db.people.insertMany([
                {
                  ref: "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
                  firstName: "John",
                  lastName: "Doe",
                  email: "john.doe@example.com",
                  address: {
                    ref: "d4e5f6a7-b8c9-0123-defa-234567890123",
                    line1: "123 Main Street",
                    line2: "Apt 4B",
                    country: "Belgium"
                  }
                },
                {
                  ref: "b2c3d4e5-f6a7-8901-bcde-f12345678901",
                  firstName: "Jane",
                  lastName: "Smith",
                  email: "jane.smith@example.com",
                  address: {
                    ref: "e5f6a7b8-c9d0-1234-efab-345678901234",
                    line1: "456 Oak Avenue",
                    line2: "Suite 100",
                    country: "Netherlands"
                  }
                },
                {
                  ref: "c3d4e5f6-a7b8-9012-cdef-123456789012",
                  firstName: "Bob",
                  lastName: "Johnson",
                  email: "bob.johnson@example.com",
                  address: {
                    ref: "d4e5f6a7-b8c9-0123-defa-234567890123",
                    line1: "123 Main Street",
                    line2: "Apt 4B",
                    country: "Belgium"
                  }
                },
                {
                  ref: "01234567-89ab-cdef-0123-456789abcdef",
                  firstName: "Alice",
                  lastName: "Williams",
                  email: "alice.williams@example.com",
                  address: {
                    ref: "f6a7b8c9-d0e1-2345-fabc-456789012345",
                    line1: "78 King Boulevard",
                    line2: null,
                    country: "Germany"
                  }
                }
              ]);

              db.people.createIndex({ ref: 1 }, { unique: true });
              db.people.createIndex({ email: 1 }, { unique: true });

              print("Seed complete. Document count: " + db.people.count());
              EOJS

              echo "MongoDB initialization complete."
