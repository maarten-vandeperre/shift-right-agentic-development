apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: cdc-connect
  namespace: agentic
spec:
  lookupPolicy:
    local: true
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnect
metadata:
  name: cdc-connect
  namespace: agentic
  annotations:
    strimzi.io/use-connector-resources: "true"
spec:
  version: 4.2.0
  replicas: 1
  bootstrapServers: cdc-cluster-kafka-bootstrap:9092
  groupId: cdc-connect-cluster
  offsetStorageTopic: cdc-connect-offsets
  configStorageTopic: cdc-connect-configs
  statusStorageTopic: cdc-connect-status
  config:
    offset.storage.replication.factor: 1
    config.storage.replication.factor: 1
    status.storage.replication.factor: 1
    key.converter: org.apache.kafka.connect.storage.StringConverter
    value.converter: org.apache.kafka.connect.storage.StringConverter
  build:
    output:
      type: imagestream
      image: cdc-connect:latest
    plugins:
      - name: debezium-postgres
        artifacts:
          - type: maven
            group: io.debezium
            artifact: debezium-connector-postgres
            version: 2.7.3.Final
          - type: maven
            group: org.apache.kafka
            artifact: connect-json
            version: 4.2.0
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
