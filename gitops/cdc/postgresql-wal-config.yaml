apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-cdc-config
  namespace: agentic
  labels:
    app: postgresql
data:
  enable-wal.sh: |
    #!/bin/bash
    echo "Configuring PostgreSQL for logical replication..."
    PGPASSWORD="${POSTGRESQL_PASSWORD}" psql -h postgresql -U "${POSTGRESQL_USER}" -d "${POSTGRESQL_DATABASE}" -c "ALTER SYSTEM SET wal_level = 'logical';" 2>/dev/null || true
    echo "WAL level set to logical. PostgreSQL restart required."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: postgresql-enable-wal
  namespace: agentic
  labels:
    app: postgresql
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: postgresql-wal-config
    spec:
      restartPolicy: OnFailure
      containers:
        - name: configure-wal
          image: image-registry.openshift-image-registry.svc:5000/openshift/postgresql:15-el9
          envFrom:
            - secretRef:
                name: postgresql-credentials
          command:
            - /bin/bash
            - -c
            - |
              echo "Waiting for PostgreSQL..."
              for i in $(seq 1 30); do
                if pg_isready -h postgresql -p 5432 -U "${POSTGRESQL_USER}" 2>/dev/null; then
                  break
                fi
                sleep 5
              done

              echo "Setting wal_level to logical..."
              PGPASSWORD="${POSTGRESQL_PASSWORD}" psql -h postgresql -U "${POSTGRESQL_USER}" -d "${POSTGRESQL_DATABASE}" <<'EOSQL'
              ALTER SYSTEM SET wal_level = 'logical';
              ALTER SYSTEM SET max_replication_slots = 4;
              ALTER SYSTEM SET max_wal_senders = 4;
              EOSQL

              echo "WAL configuration applied. Restarting PostgreSQL pod..."
              echo "Done. PostgreSQL needs a pod restart to apply wal_level=logical."
