apiVersion: v1
kind: ServiceAccount
metadata:
  name: mesh-config-sa
  namespace: agentic
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mesh-config-role
  namespace: agentic
rules:
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["security.istio.io"]
    resources: ["authorizationpolicies"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mesh-config-binding
  namespace: agentic
subjects:
  - kind: ServiceAccount
    name: mesh-config-sa
    namespace: agentic
roleRef:
  kind: Role
  name: mesh-config-role
  apiGroup: rbac.authorization.k8s.io
