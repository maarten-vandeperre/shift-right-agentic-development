apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: agentic
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/maarten-vandeperre/shift-right-frontend:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: VITE_PERSON_API
              value: /proxy/persons/api/persons
            - name: VITE_ADDRESS_API
              value: /proxy/addresses/api/addresses
            - name: VITE_PEOPLE_API
              value: /proxy/people/api/people
            - name: VITE_CDC_API
              value: /proxy/cdc/api/cdc/events
            - name: VITE_CHAT_API
              value: /proxy/chat/api/chat
            - name: VITE_MESH_API
              value: /proxy/mesh/api/mesh
            - name: VITE_KIALI_URL
              value: https://kiali-kiali.apps.ocp.h7xz9.sandbox1562.opentlc.com
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
