apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: agentic
  labels:
    app: chat-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      containers:
        - name: chat-service
          image: ghcr.io/maarten-vandeperre/shift-right-chat-service:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: PEOPLE_SERVICE_URL
              value: http://people-service:8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
