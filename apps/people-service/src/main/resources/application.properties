quarkus.mongodb.connection-string=${MONGODB_CONNECTION_STRING:mongodb://agentic:agentic-mongo-pass@mongodb:27017/agentic?authSource=agentic}
quarkus.mongodb.database=${MONGODB_DATABASE:agentic}
quarkus.mongodb.health.enabled=false

quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:/.*/}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,Accept
