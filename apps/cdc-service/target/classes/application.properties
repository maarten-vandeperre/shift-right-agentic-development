quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:/.*/}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,Accept

# Kafka
mp.messaging.incoming.person-changes.connector=smallrye-kafka
mp.messaging.incoming.person-changes.topic=cdc.public.person
mp.messaging.incoming.person-changes.bootstrap.servers=${KAFKA_BOOTSTRAP:cdc-cluster-kafka-bootstrap:9092}
mp.messaging.incoming.person-changes.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.person-changes.group.id=cdc-integration
mp.messaging.incoming.person-changes.auto.offset.reset=earliest
mp.messaging.incoming.person-changes.failure-strategy=ignore

mp.messaging.incoming.address-changes.connector=smallrye-kafka
mp.messaging.incoming.address-changes.topic=cdc.public.address
mp.messaging.incoming.address-changes.bootstrap.servers=${KAFKA_BOOTSTRAP:cdc-cluster-kafka-bootstrap:9092}
mp.messaging.incoming.address-changes.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.address-changes.group.id=cdc-integration
mp.messaging.incoming.address-changes.auto.offset.reset=earliest
mp.messaging.incoming.address-changes.failure-strategy=ignore

# REST Clients
quarkus.rest-client.person-api.url=${PERSON_SERVICE_URL:http://person-service:8080}
quarkus.rest-client.address-api.url=${ADDRESS_SERVICE_URL:http://address-service:8080}
quarkus.rest-client.people-api.url=${PEOPLE_SERVICE_URL:http://people-service:8080}
