quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${POSTGRESQL_JDBC_URL:jdbc:postgresql://postgresql:5432/agentic}
quarkus.datasource.username=${POSTGRESQL_USER:agentic}
quarkus.datasource.password=${POSTGRESQL_PASSWORD:agentic-db-pass}

quarkus.hibernate-orm.database.generation=none

quarkus.http.port=8080
quarkus.http.cors=true
