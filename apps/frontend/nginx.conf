worker_processes auto;
error_log /dev/stderr;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;
        server_name _;
        root /opt/app-root/src;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /config.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        resolver 172.30.0.10 valid=10s;

        location ~ ^/proxy/persons/(.*)$ {
            set $upstream person-service.agentic.svc.cluster.local;
            proxy_pass http://$upstream:8080/$1$is_args$args;
            proxy_set_header Host person-service;
            proxy_http_version 1.1;
        }

        location ~ ^/proxy/addresses/(.*)$ {
            set $upstream address-service.agentic.svc.cluster.local;
            proxy_pass http://$upstream:8080/$1$is_args$args;
            proxy_set_header Host address-service;
            proxy_http_version 1.1;
        }

        location ~ ^/proxy/people/(.*)$ {
            set $upstream people-service.agentic.svc.cluster.local;
            proxy_pass http://$upstream:8080/$1$is_args$args;
            proxy_set_header Host people-service;
            proxy_http_version 1.1;
        }

        location ~ ^/proxy/cdc/(.*)$ {
            set $upstream cdc-service.agentic.svc.cluster.local;
            proxy_pass http://$upstream:8080/$1$is_args$args;
            proxy_set_header Host cdc-service;
            proxy_http_version 1.1;
        }

        location ~ ^/proxy/chat/(.*)$ {
            set $upstream chat-service.agentic.svc.cluster.local;
            proxy_pass http://$upstream:8080/$1$is_args$args;
            proxy_set_header Host chat-service;
            proxy_http_version 1.1;
        }

        location ~ ^/proxy/mesh/(.*)$ {
            set $upstream mesh-config-service.agentic.svc.cluster.local;
            proxy_pass http://$upstream:8080/$1$is_args$args;
            proxy_set_header Host mesh-config-service;
            proxy_http_version 1.1;
        }
    }
}
