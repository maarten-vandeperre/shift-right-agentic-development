worker_processes auto;
error_log /dev/stderr;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;
        server_name _;
        root /opt/app-root/src;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /config.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location /proxy/persons/ {
            proxy_pass http://person-service:8080/;
            proxy_set_header Host person-service;
        }

        location /proxy/addresses/ {
            proxy_pass http://address-service:8080/;
            proxy_set_header Host address-service;
        }

        location /proxy/people/ {
            proxy_pass http://people-service:8080/;
            proxy_set_header Host people-service;
        }

        location /proxy/cdc/ {
            proxy_pass http://cdc-service:8080/;
            proxy_set_header Host cdc-service;
        }

        location /proxy/chat/ {
            proxy_pass http://chat-service:8080/;
            proxy_set_header Host chat-service;
        }

        location /proxy/mesh/ {
            proxy_pass http://mesh-config-service:8080/;
            proxy_set_header Host mesh-config-service;
        }
    }
}
